[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
# MIT with the Commons Clause (D486): no SPDX identifier exists for it, so
# the crates point at the file.
license-file = "LICENSE"
repository = "https://github.com/lnorton89/strobe"

# One version of each dependency for the whole workspace. A crate names
# what it uses with `{ workspace = true }`, so a bump is one line here
# rather than a hunt through nine manifests that drift apart.
[workspace.dependencies]
strobe-scene = { path = "crates/strobe-scene" }
strobe-ssf-lib = { path = "crates/strobe-ssf-lib" }
# Without `native` (context creation) or `capture` (cpal), so the browser
# build (strobe-web, D524) can take the renderer and the DSP alone; the
# native crates name the feature.
strobe-gfx = { path = "crates/strobe-gfx", default-features = false }
strobe-audio = { path = "crates/strobe-audio", default-features = false }
strobe-script = { path = "crates/strobe-script" }
strobe-diag = { path = "crates/strobe-diag" }
strobe-playlist = { path = "crates/strobe-playlist" }
strobe-io = { path = "crates/strobe-io" }
strobe-autocontrol = { path = "crates/strobe-autocontrol" }
strobe-remote = { path = "crates/strobe-remote" }
strobe-projector = { path = "crates/strobe-projector" }
# Without its `net` feature (the HTTP client, which needs C for ring): a
# crate that only converts or analyses shaders must not pull a C compiler
# into the Windows cross-check. The app opts in.
strobe-shadertoy = { path = "crates/strobe-shadertoy", default-features = false }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
toml_edit = "0.25"
# The Windows executable's icon resource (strobe-app's build script).
embed-resource = "3"
dirs = "7"
# Out-of-process crash capture: crash-handler catches the fault in the app,
# minidumper writes the dump from a second process.
crash-handler = "0.8"
minidumper = "0.11"
log = "0.4"
# Native file and folder pickers (D470). On Linux through the XDG desktop
# portal (pure Rust, no GTK); no Wayland window-handle support needed.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
clap = { version = "4", features = ["derive"] }
# Audio: cpal captures, realfft transforms, rtrb carries samples from the
# audio callback to the analysis thread, arc-swap publishes the result to
# the render thread, hound reads WAVs for the offline tuning harness.
cpal = "0.18"
realfft = "3.5"
rtrb = "0.4"
arc-swap = "1.9"
hound = "3.5"

# Show control (D170): MIDI input (ALSA, WinMM, CoreMIDI) and OSC 1.0 parsing.
# midir is behind strobe-io's `midi` feature.
midir = "0.11"
rosc = "0.11"

rquickjs = "0.14"
# Shadertoy import (D110): a small blocking HTTP client with rustls (no
# OpenSSL, no async runtime), SHA-256 for the asset cache's keys, and the OS
# random source for the listener's token.
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.11"
getrandom = "0.4"
# The LAN remote's WebSocket handshake (RFC 6455's Sec-WebSocket-Accept is a
# SHA-1). Same RustCrypto family and `digest` version as sha2, so it adds
# one crate and no new transitive ones (D250).
sha1 = "0.11"
# The venue trust file's challenge-response (D288): HMAC-SHA256 over the
# same `digest` 0.11 as sha2 and sha1, with a constant-time tag comparison
# (`subtle`, already in the tree). It adds this one crate.
hmac = "0.13"
# PJLink's and Panasonic NTCONTROL's authentication digest (D502). The same
# RustCrypto `digest` 0.11 as sha1 and sha2: it adds this one crate.
md-5 = "0.11"
# Local time for `strobe_Date` (D111). Only the clock feature: no serde,
# no time-zone database, no wasm shims.
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Decoding the desktop remote's JPEG frames (D275). Already in the tree
# through ureq, so it adds no crate.
base64 = "0.23"

# The GL stack. glow is the bindings; glutin creates the context — natively
# (WGL / GLX / EGL / CGL) or through ANGLE's libEGL on Windows, which is the
# same EGL code path pointed at a different library. See strobe-gfx's docs.
glow = "0.17"
glutin = { version = "0.32", default-features = false, features = ["egl", "glx", "wgl", "x11", "wayland"] }
glutin-winit = { version = "0.5", default-features = false, features = ["egl", "glx", "wgl", "x11", "wayland"] }
# winit's defaults minus `wayland-csd-adwaita`: Wayland client-side title
# bars drawn by sctk-adwaita, which pulls in ttf-parser (unmaintained,
# RUSTSEC-2026-0192, no fixed release). Windows and X11 never used it; on a
# Wayland compositor without server-side decorations the windows have no
# title bar until the app's own (D5) lands. See D122.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }
raw-window-handle = "0.6"
# The browser build (strobe-web, D524): glow's WebGL2 backend takes a
# web-sys context, so these are the versions glow 0.17 already resolves.
wasm-bindgen = "0.2.129"
js-sys = "0.3.106"
web-sys = "0.3.106"

egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui_glow = { version = "0.37", features = ["winit"] }
egui-winit = { version = "0.37", default-features = false, features = ["links", "clipboard", "wayland", "x11"] }

[workspace.lints.rust]
warnings = "deny"
dead_code = "deny"
non_snake_case = "deny"
non_upper_case_globals = "deny"
non_camel_case_types = "deny"
unused_variables = "deny"
unused_imports = "forbid"
unused_must_use = "forbid"
unreachable_patterns = "forbid"
unreachable_pub = "forbid"
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
match_wild_err_arm = "deny"
rest_pat_in_fully_bound_structs = "deny"
ignored_unit_patterns = "deny"
allow_attributes = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Crash reports and minidumps are only as useful as their symbols (D42).
# `line-tables-only` is enough for function names and file:line in a
# backtrace or WinDbg stack at a small cost in size. `strip = "debuginfo"`
# would make rustc pass /DEBUG:NONE to the MSVC linker, which produces no
# PDB at all, so stripping is off. On Windows the symbols live in a separate
# .pdb that is not loaded at runtime; ship it with each release build.
debug = "line-tables-only"
strip = "none"
# A show that panics should stop and say so; the output window is the one
# thing on a projector, and unwinding through a GL context buys nothing.
panic = "abort"

# Debug builds of a renderer are unusably slow at the dependency level
# (the FFT, the JS engine, image decoding), and that is not where the bugs
# being debugged live. Optimise dependencies, keep this workspace's own
# crates debuggable. Dependencies keep file and line numbers, so a
# backtrace still names the line inside egui or glow, but not full type and
# variable information: on Windows most of a small debug rebuild is
# link.exe writing the PDB, and that scales with the debug info it is
# given (rustaman measured 1.27 GB of rlibs down to 0.77 GB, D487).
[profile.dev.package."*"]
opt-level = 2
debug = "line-tables-only"

# The optimised build to iterate with (D487): `cargo run --profile
# release-fast -p strobe-app`. Same opt-level, panic and symbols as
# `release`, but no LTO and incremental, so an edit rebuilds in seconds
# rather than relinking the whole program through fat LTO on one codegen
# unit (about ten minutes). It is not the binary that ships: measure and
# release with `--release`.
[profile.release-fast]
inherits = "release"
lto = false
incremental = true
# Dependencies at rustc's own release default: they build once.
codegen-units = 16

# The crates an edit usually touches, at rustc's incremental default, so an
# edit invalidates only the units holding what changed.
[profile.release-fast.package.strobe-app]
codegen-units = 256
[profile.release-fast.package.strobe-gfx]
codegen-units = 256
[profile.release-fast.package.strobe-scene]
codegen-units = 256

# The browser sandbox's engine (strobe-web, D524): `release` sized for a
# download rather than tuned for speed, since the GPU does the per-frame
# work and the page's first paint waits on the file. No symbols: a browser
# has no minidump to symbolicate.
[profile.release-web]
inherits = "release"
opt-level = "s"
debug = false
strip = true
