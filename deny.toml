# cargo-deny configuration, enforced by the `deny` job in CI.
# `cargo install cargo-deny && cargo deny check` locally gives the same answer.

[graph]
# The targets Strobe is built for. Windows is the shipping platform; Linux
# runs the headless renderer tests and is a later desktop target.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
yanked = "warn"
# An entry must say which crate, what pulls it in, why there is no fix,
# and what would clear it.
ignore = [
    # paste 1.0.15, unmaintained (archived by its author). Pulled in by
    # nokhwa 0.10.11, the webcam capture (D528, D530), which uses it
    # to generate code. It is a proc-macro: it runs in the compiler and puts no code of
    # its own in strobe.exe, and there is no newer release to move to.
    # Cleared when a nokhwa release drops it, or capture moves off nokhwa.
    { id = "RUSTSEC-2024-0436", reason = "paste is a build-time proc-macro of nokhwa's; unmaintained, not vulnerable (D530)" },
]

[licenses]
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    "BSL-1.0",
    "MPL-2.0",
    "OFL-1.1",
    # webpki-roots, the Mozilla CA bundle compiled into the Shadertoy HTTP
    # client (ureq + rustls, D110). CDLA-Permissive-2.0 is a permissive
    # data licence: use and redistribution with no copyleft, attribution
    # kept in the licence text only.
    "CDLA-Permissive-2.0",
    # egui's bundled default fonts.
    "Ubuntu-font-1.0",
]
confidence-threshold = 0.9

# Strobe's own crates are MIT with the Commons Clause (D486), which has no
# SPDX identifier. None is published (`publish = false` in each), so they
# are left out of the licence check, which is about what we depend on.
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
