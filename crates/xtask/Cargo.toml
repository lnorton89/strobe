[package]
name = "xtask"
description = "The workspace's own tooling: `cargo xtask ci`, `changelog`, `credits`, `bench`, `symbolicate` and `brand`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
# `cargo metadata`'s JSON, for `cargo xtask credits`.
serde_json.workspace = true
# SVG rasterisation for `cargo xtask brand`. No text, no system fonts: the
# icons hold no glyphs, and the output must not depend on the machine.
resvg = { version = "0.48", default-features = false }

[lints]
workspace = true
