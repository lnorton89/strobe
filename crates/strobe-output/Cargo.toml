[package]
name = "strobe-output"
description = "Sharing the finished picture: the output frame, BGRA and UYVY packing, the Spout and NDI senders, and probes for their optional runtimes. No GL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[dependencies]
log.workspace = true

# The Spout library is a DLL with a C++ name-mangled ABI: no import library
# ships with it, so it is found and its exports resolved at runtime (D571).
[target.'cfg(windows)'.dependencies]
libloading.workspace = true

# The NDI sender (D570). Its runtime is loaded at runtime by the crate, so this
# needs no SDK and no C toolchain at build time; without the runtime a sender
# reports what to install.
grafton-ndi = { workspace = true, optional = true }

[features]
default = []
# The NDI sender. On by default in the app; off for a build that must not carry
# the dependency at all.
ndi = ["dep:grafton-ndi"]

[dev-dependencies]
anyhow.workspace = true

[lints]
workspace = true
