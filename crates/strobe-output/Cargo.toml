[package]
name = "strobe-output"
description = "Sharing the finished picture: the frame layouts, BGRA and UYVY packing, the Spout and NDI senders, and probes for their optional runtimes. No GL."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[dependencies]
log.workspace = true
# The NDI sender (D570, D573). On Windows and Linux its runtime is loaded at
# run time, so this needs no SDK and no C toolchain at build time; without the
# runtime a sender says where to get it. (Apple targets link the SDK
# statically and need NDI_SDK_DIR: not built there yet.)
grafton-ndi = { workspace = true, optional = true }

# Spout's library is a DLL with a C++ vtable interface and no import library,
# so it is found and its one export resolved at runtime (D571, D572).
[target.'cfg(windows)'.dependencies]
libloading.workspace = true

[features]
default = []
# The NDI sender. On in the app; off for a build that must not carry the
# dependency at all.
ndi = ["dep:grafton-ndi"]

[dev-dependencies]
anyhow.workspace = true

[lints]
workspace = true
