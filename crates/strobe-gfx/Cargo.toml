[package]
name = "strobe-gfx"
description = "The GL renderer: context providers (native GL, ANGLE, headless EGL), programs, passes, presentation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false

[dependencies]
strobe-scene.workspace = true
glow.workspace = true
glutin = { workspace = true, optional = true }
glutin-winit = { workspace = true, optional = true }
winit = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
thiserror.workspace = true
log.workspace = true
image.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-sys = { workspace = true, features = ["WebGl2RenderingContext"] }

[features]
# Context creation: glutin and winit for native windows, ANGLE and headless
# EGL, and the offscreen worker built on them. Off, the crate is the GL
# boundary and the player over a context made elsewhere: the browser's
# WebGL2 canvas in strobe-web (D524).
default = ["native"]
native = ["dep:glutin", "dep:glutin-winit", "dep:winit", "dep:raw-window-handle"]

[dev-dependencies]
anyhow.workspace = true

[lints]
workspace = true
