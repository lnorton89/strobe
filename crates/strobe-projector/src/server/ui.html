<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projector Control</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --fg:#e6e8ec; --mut:#8a93a3;
          --on:#2fbf71; --off:#e5484d; --warn:#f5a524; --btn:#232834; }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.4 system-ui,Segoe UI,sans-serif; padding:16px }
  h1 { font-size:18px; font-weight:600; margin:0 0 16px; display:flex; justify-content:space-between; align-items:center }
  .all { display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap }
  .grid { display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)) }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px }
  .head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px }
  .name { font-weight:600 } .ip { color:var(--mut); font-size:13px }
  .pill { display:inline-block; padding:2px 10px; border-radius:99px; font-size:13px; font-weight:600; background:var(--btn) }
  .pill.on { background:color-mix(in srgb,var(--on) 25%,transparent); color:var(--on) }
  .pill.off { background:color-mix(in srgb,var(--off) 20%,transparent); color:var(--off) }
  .pill.warming,.pill.cooling { background:color-mix(in srgb,var(--warn) 22%,transparent); color:var(--warn) }
  dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:10px 0; font-size:13px }
  dt { color:var(--mut) } dd { margin:0; word-break:break-word }
  .row { display:flex; gap:8px }
  button { flex:1; background:var(--btn); color:var(--fg); border:1px solid var(--line); border-radius:8px;
           padding:10px 14px; font:inherit; font-weight:600; cursor:pointer }
  button:hover { border-color:var(--mut) } button:disabled { opacity:.5; cursor:wait }
  button.on { border-color:color-mix(in srgb,var(--on) 50%,transparent) }
  button.off { border-color:color-mix(in srgb,var(--off) 50%,transparent) }
  #msg { color:var(--mut); font-size:13px; margin-top:14px; white-space:pre-wrap }
</style>
</head>
<body>
<h1>Projector Control <span class="ip" id="upd"></span></h1>
<div class="all">
  <button class="on" data-t="all" data-a="on">All On</button>
  <button class="off" data-t="all" data-a="off">All Off</button>
  <button data-t="all" data-a="status">Refresh</button>
</div>
<div class="grid" id="grid"></div>
<div id="msg"></div>
<script>
const grid = document.getElementById('grid'), msg = document.getElementById('msg');
const esc = s => String(s ?? '—').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path, method='GET') {
  const r = await fetch(path, {method, credentials:'same-origin'});
  if (r.status === 401) { location.href = '/'; throw new Error('unauthorized'); }
  return [r.status, await r.json()];
}
function render(units, st={}) {
  grid.innerHTML = Object.entries(units).map(([k,u]) => {
    const s = st[k] || {}, p = (s.power||'').split(':')[0];
    return `<div class="card"><div class="head"><span class="name">${esc(u.name)}</span><span class="ip">${esc(u.ip)}</span></div>
      <span class="pill ${esc(p)}">${esc(s.power ?? (s.error ? 'error' : '…'))}</span>
      <dl><dt>Input</dt><dd>${esc(s.input)}</dd><dt>Hours</dt><dd>${esc(s.hours)}</dd><dt>Errors</dt><dd>${esc(s.errors ?? s.error)}</dd></dl>
      <div class="row"><button class="on" data-t="${esc(k)}" data-a="on">On</button>
      <button class="off" data-t="${esc(k)}" data-a="off">Off</button>
      <button data-t="${esc(k)}" data-a="status">Status</button></div></div>`;
  }).join('');
}
let units = {}, last = {};
async function refresh(t='all') {
  const [, st] = await api('/api/status/' + t);
  Object.assign(last, st); render(units, last);
  document.getElementById('upd').textContent = 'updated ' + new Date().toLocaleTimeString();
}
document.addEventListener('click', async e => {
  const b = e.target.closest('button[data-a]'); if (!b) return;
  const {t, a} = b.dataset;
  if (a === 'off' && !confirm(`Power OFF ${t}?`)) return;
  document.querySelectorAll('button').forEach(x => x.disabled = true);
  msg.textContent = a === 'status' ? 'Querying…' : `Sending ${a} to ${t}… (waits out warming/cooling, up to 90 s)`;
  try {
    if (a !== 'status') {
      const [code, r] = await api(`/api/power/${t}/${a}`, 'POST');
      msg.textContent = Object.entries(r).map(([k,v]) => `${k}: ${v.ok ? (v.sent ? a+' sent' : 'already '+v.previous) : 'FAILED – '+v.error}`).join('\n');
    } else msg.textContent = '';
    await refresh(t);
  } catch (err) { msg.textContent = 'Error: ' + err.message; }
  finally { document.querySelectorAll('button').forEach(x => x.disabled = false); }
});
(async () => { [, units] = await api('/api/units'); render(units); refresh(); setInterval(() => refresh(), 30000); })();
</script>
</body>
</html>
