<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#080b14">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Projectors">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Strobe projectors</title>
<style>
/* The projector page's tokens and grammar (ui.html), for the one form a browser without the session cookie sees. */
:root {
  --ground: #080b14;
  --panel: #101725;
  --hairline: #253247;
  --hairline-strong: #34445e;
  --mute: #5d6b80;
  --secondary: #9aa8bc;
  --text: #f3f6fa;
  --label: #8a98ae;
  --accent: #00e5ff;
  --accent-deep: #00b8d4;
  --on-accent: #080b14;
  --display: "Space Grotesk", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-contrast: more) {
  :root { --ground: #000; --panel: #000; --hairline: #fff; --hairline-strong: #fff; --secondary: #fff; --label: #fff; --text: #fff; --accent: #5ff; }
}
* { box-sizing: border-box; }
html { background: var(--ground); -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  display: grid;
  place-items: center;
  background: var(--ground);
  color: var(--text);
  font: 15px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
main { width: 100%; max-width: 420px; border: 1px solid var(--hairline); border-radius: 5px; overflow: hidden; background: var(--panel); }
.spectrum { height: 2px; background: linear-gradient(90deg, #00e5ff 0%, #3382f6 35%, #8a55f7 68%, #ec4b99 100%); }
.body { padding: 22px 20px 24px; }
.rule { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--hairline); padding-bottom: 12px; margin-bottom: 18px; }
.rule svg { display: block; flex: none; }
.heading { font: 600 11px/1.2 var(--sans); letter-spacing: 0.2em; text-transform: uppercase; }
h1 { margin: 0 0 8px; font: 600 26px/1.15 var(--display); letter-spacing: -0.02em; }
p { margin: 0; color: var(--secondary); }
form { display: flex; flex-direction: column; gap: 8px; margin-top: 20px; }
label { color: var(--label); font: 500 10px/1.2 var(--mono); letter-spacing: 0.16em; text-transform: uppercase; }
input {
  font: 500 17px/1.3 var(--mono);
  color: var(--text);
  background: var(--ground);
  border: 1px solid var(--hairline-strong);
  border-radius: 0;
  padding: 12px 14px;
  min-height: 52px;
}
input:focus { border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input:focus-visible { outline-offset: 0; }
button {
  margin-top: 6px;
  min-height: 52px;
  font: 600 13px/1.2 var(--sans);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--on-accent);
  background: var(--accent);
  border: 0;
  border-radius: 0;
  cursor: pointer;
}
button:hover, button:active { background: var(--accent-deep); }
.message { min-height: 1.5em; margin-top: 4px; color: #ff9a47; }
@media (forced-colors: active) { button { border: 1px solid ButtonText; } }
</style>
</head>
<body>
<main>
  <div class="spectrum" aria-hidden="true"></div>
  <div class="body">
    <div class="rule">
      <svg width="18" height="18" viewBox="76 82 322 320" aria-hidden="true" focusable="false">
        <path d="M117 269 C93 175 166 99 252 119 C318 135 381 205 360 273 C339 334 260 386 192 355 C136 330 115 273 157 226 C202 176 279 180 322 223 C355 258 333 304 290 322" fill="none" stroke="#00e5ff" stroke-width="36" stroke-linecap="round"/>
      </svg>
      <span class="heading">Strobe projectors</span>
    </div>
    <h1>Unlock projector control</h1>
    <p>Enter the page's password from this computer's projector settings. This browser stays signed in, so you are asked once.</p>
    <form id="f">
      <label for="p">Password</label>
      <input id="p" type="password" autocomplete="current-password" autocapitalize="off" spellcheck="false" required autofocus aria-describedby="m">
      <button type="submit">Unlock</button>
      <p id="m" class="message" role="alert"></p>
    </form>
  </div>
</main>
<script>
"use strict";
// D516: the password goes to /login in a header, never in the address or
// the history; the answer sets the session cookie, then the page loads.
const f = document.getElementById('f'), p = document.getElementById('p'), m = document.getElementById('m');
f.addEventListener('submit', async e => {
  e.preventDefault();
  m.textContent = '';
  try {
    const r = await fetch('/login', {headers: {Authorization: 'Bearer ' + p.value}, credentials: 'same-origin'});
    if (r.ok) { location.replace('/'); } else { m.textContent = 'Wrong password.'; p.select(); }
  } catch (err) { m.textContent = 'Could not reach the projector service.'; }
});
</script>
</body>
</html>
