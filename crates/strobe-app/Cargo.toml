[package]
name = "strobe-app"
description = "The desktop app: control window (egui), output window, scene browser, and the frame loop."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish = false
# Two binaries: the app, and the corpus harness (D195). Plain `cargo run -p
# strobe-app` must keep meaning the app.
default-run = "strobe"
build = "build.rs"

[[bin]]
name = "strobe"
path = "src/main.rs"

[[bin]]
name = "strobe-corpus"
path = "src/corpus_main.rs"

[dependencies]
strobe-scene.workspace = true
strobe-gfx.workspace = true
strobe-diag.workspace = true
strobe-audio.workspace = true
strobe-script.workspace = true
strobe-playlist.workspace = true
strobe-io.workspace = true
strobe-autocontrol.workspace = true
strobe-shadertoy = { workspace = true, features = ["net"] }
strobe-remote.workspace = true
anyhow.workspace = true
clap.workspace = true
image.workspace = true
base64.workspace = true
log.workspace = true
thiserror.workspace = true
egui.workspace = true
egui_glow.workspace = true
egui-winit.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
winit.workspace = true
rfd.workspace = true

[build-dependencies]
embed-resource.workspace = true

[dev-dependencies]
# A host that misbehaves on purpose, for the controller's unsolicited-challenge
# test (D294): it must answer the WebSocket upgrade itself.
sha1.workspace = true

[lints]
workspace = true
