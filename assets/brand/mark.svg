      <stop offset=".34" stop-color="#3382F6"/>
      <stop offset=".68" stop-color="#8A55F7"/>
      <stop offset="1" stop-color="#EC4B99"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0">
