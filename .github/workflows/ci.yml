name: CI

on:
  push:
    # `master` is the default branch; agent work lands on claude/*
    # branches first, which must be checked on every push too.
    branches: [master, "claude/**"]
  pull_request:
  workflow_dispatch:
  # release.yml runs this whole workflow on the tagged commit before it
  # publishes (D521). `ref` is that commit's SHA; every checkout below
  # takes it, and on any other event it is empty, which checks out the
  # event's own commit as before.
  workflow_call:
    inputs:
      ref:
        description: "Commit SHA to check out and test"
        required: true
        type: string

# A second push to the same branch makes the first run's result irrelevant.
# A release's run is keyed by its commit instead: called from release.yml,
# `github.ref` is the caller's, and a dispatched release shares it with
# master's pushes, which would cancel the release's tests (or be cancelled
# by them).
concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

# Least privilege by default: nothing in this workflow writes to the
# repository, so the token it runs with can only read it. A job that needs
# more says so itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation helps a developer's next edit, never a fresh
  # runner: it only makes the cache bigger and slower to save and restore
  # (D504). It also overrides `release-fast`'s `incremental = true`.
  CARGO_INCREMENTAL: "0"

# Every job runs `cargo --locked xtask ci --strict <lanes>` (D533). The
# commands, their flags and each platform's exclusions live in
# crates/xtask/src/ci.rs, so this file installs what the lanes need,
# restores a cache and uploads what they leave behind; a developer runs the
# same lanes with `cargo xtask ci <lanes>`. `--strict` fails a step whose
# prerequisite is missing instead of skipping it, and fails a run that
# changed the tree. `--locked` before the alias reaches the `cargo run`
# that builds xtask; xtask passes it to every cargo command it runs.
#
# Every job has a timeout, well above its slowest cold-cache run, so a hung
# test fails in minutes rather than holding a runner for six hours. The
# long steps inside a lane have timeouts of their own, in xtask.
jobs:
  # A pull request that changes only Markdown and `docs/` skips the three
  # platform builds, ten minutes each, and runs `docs` instead: the
  # conventions tests, which check every link, decision number and known
  # gap (D531). Pushes, releases and manual runs always build everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "$BASE...$HEAD")
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qvE '(\.md$|^docs/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  docs:
    name: docs (conventions only)
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-08
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: docs
          save-if: ${{ !inputs.ref }}
      - run: cargo --locked xtask ci --strict conventions

  format:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to full SHAs: a mutable tag in a workflow is a supply-chain
      # risk. The versions are in the trailing comments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # The version matches rust-toolchain.toml; strobe-conventions'
      # `toolchain` tests fail the build if the two drift.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-08
        with:
          toolchain: "1.98.0"
          components: rustfmt
      # The cache holds the xtask build the lane runs from.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: xtask
          save-if: ${{ !inputs.ref }}
      - run: cargo --locked xtask ci --strict fmt

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-08
        with:
          toolchain: "1.98.0"
      # A prebuilt, pinned cargo-deny: the version moves deliberately, in a
      # reviewed commit, like an action's SHA.
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-deny@0.20.2
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: xtask
          save-if: ${{ !inputs.ref }}
      - run: cargo --locked xtask ci --strict deny

  changelog:
    name: changelog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # CHANGELOG.md is generated from the git history by `cargo xtask
    # changelog`, so a released section that disagrees with the tags is a
    # mistake, not a style choice. The icon PNGs and THIRD_PARTY.md (D491)
    # are generated too, and the `generated` lane checks all three.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # The checks read `git tag` and walk the whole history. The
          # default checkout is shallow and fetches no tags at all, so
          # every release would come back missing.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-08
        with:
          toolchain: "1.98.0"
      # A release's run (D521) restores the caches but saves none: a tag's
      # cache is readable by that tag alone, and a gigabyte of it per
      # release would push master's out of the repository's 10 GB, the
      # ones every pull request starts from (D505).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: changelog
          save-if: ${{ !inputs.ref }}
      - run: cargo --locked xtask ci --strict generated

  windows:
    name: windows (the shipping platform)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    # About 16 minutes on master with a warm cache; a cold one builds
    # three profiles' dependencies from scratch.
    timeout-minutes: 90
    # The platform the show runs on. A GitHub runner has no GPU and no
    # interactive session, so the renderer tests skip themselves here (no
    # headless GL context) and the lane's summary counts them (D249); the
    # Linux job is where shaders are actually compiled. This job proves the
    # Windows build, the WGL/EGL context code and the release settings
    # compile and link.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-08
        with:
          toolchain: "1.98.0"
          components: clippy
      # rust-cache never saves after an exact hit, so a key that stays the
      # same keeps the cache it first saved. "-fast" names the cache that
      # holds release-fast (D504, D505); change it when the profiles built
      # here change, or master keeps restoring an old cache (D507).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-fast
          save-if: ${{ !inputs.ref }}
      # The `build` lane builds `release-fast` (the shipping settings
      # without fat LTO and one codegen unit). Master and a manual run add
      # the fat-LTO `release` build (D504). Master builds `release-fast`
      # too: GitHub shares only the default branch's cache with pull
      # requests, so that is what keeps their dependencies warm (D505). A
      # release's run (D521) skips the fat-LTO build: release.yml builds
      # exactly that, from the same commit, in its own job.
      - name: Check, test and build
        shell: bash
        env:
          SHIPPING: ${{ !inputs.ref && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch') }}
        run: |
          if [ "$SHIPPING" = "true" ]; then
            cargo --locked xtask ci --strict check test build --shipping
          else
            cargo --locked xtask ci --strict check test build
          fi

  macos:
    name: macos (the portable crates)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    # macOS is a later target, so its lanes are two-tier (xtask holds the
    # list): the blocking tier is every crate with no OpenGL context in it,
    # and a whole-workspace clippy runs as information. `strobe-gfx`'s
    # headless context is glutin's EGL backend, which glutin compiles out
    # on Apple targets; the CGL port is future work.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-08
        with:
          toolchain: "1.98.0"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos
          save-if: ${{ !inputs.ref }}
      - run: cargo --locked xtask ci --strict check test

  linux:
    name: linux (headless GL)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # About 8 minutes on master with a warm cache.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-08
        with:
          toolchain: "1.98.0"
          components: clippy
          # The `check` lane's Windows cross-check type-checks the
          # Windows-only code (WGL, ANGLE loading) without linking.
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux-fast
          save-if: ${{ !inputs.ref }}
      # Mesa's software rasteriser behind surfaceless EGL: a real GLSL
      # compiler for both desktop GL 3.3 core (the native path) and GLES 3.0
      # (the dialect the ANGLE path speaks), with no display and no GPU,
      # and Xvfb for the `render` lane's window tests.
      - name: Install headless GL
        run: sudo apt-get update && sudo apt-get install -y libegl1 libegl-mesa0 libgl1-mesa-dri libglx-mesa0 libxkbcommon-dev libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxi6 libxrandr2 xvfb libasound2-dev pkg-config
      # `check`: clippy, strobe-io without MIDI, the Windows cross-check.
      # `test`: with STROBE_REQUIRE_HEADLESS_GL, so a missing driver fails.
      # `render`: the app on Xvfb (two windows, one shared context, frames
      # read back to PNGs), auto-controls on a window context (D140), and
      # the scene library in both dialects. Mesa's llvmpipe is CPU
      # rasterisation, so results.md's timings are not a GPU's, but the
      # images are a pure function of time, so a reviewer can open the
      # contact sheet from any pull request.
      - run: cargo --locked xtask ci --strict check test render
      # `!cancelled()` rather than the default success(): a run where one
      # scene broke is exactly the run whose other frames you want to see.
      - name: Upload frames (desktop GL)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-desktop
          path: target/bench
          if-no-files-found: warn
          retention-days: 14
      - name: Upload frames (GLES)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-gles
          path: target/bench-gles
          if-no-files-found: warn
          retention-days: 14
      # The corpus gate's reports, gate.md, this run's final frames and, for
      # a frame that moved, its baseline, candidate and diff (D534). A
      # change meant to move a frame takes its new baseline from here.
      - name: Upload the corpus gate
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-gate
          path: target/corpus-gate
          if-no-files-found: warn
          retention-days: 14

  # The one check the master ruleset requires (D533). It runs whatever the
  # others did and passes only when every job that should have run passed:
  # a failed or cancelled job fails it, and so does a skipped one unless the
  # `changes` job's verdict is what skipped it. Requiring each job by name
  # instead let a job that never started (a broken `if:`, a renamed job)
  # leave nothing to wait for.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [changes, docs, format, deny, changelog, windows, macos, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job passed
        shell: bash
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          code=$(jq -r '.changes.outputs.code // ""' <<<"$NEEDS")
          case "$code" in
            true) platform=success; docs=skipped ;;
            false) platform=skipped; docs=success ;;
            *) echo "The changes job gave no verdict, so nothing can be judged."; exit 1 ;;
          esac
          fail=0
          expect() {
            got=$(jq -r --arg j "$1" '.[$j].result' <<<"$NEEDS")
            if [ "$got" = "$2" ]; then
              echo "ok      $1: $got"
            else
              echo "FAILED  $1: $got, expected $2"
              fail=1
            fi
          }
          expect changes success
          expect format success
          expect deny success
          expect changelog success
          expect docs "$docs"
          expect windows "$platform"
          expect macos "$platform"
          expect linux "$platform"
          exit "$fail"
