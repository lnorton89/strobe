name: CI

on:
  push:
    # `master` is the default branch; agent work lands on claude/*
    # branches first, which must be checked on every push too.
    branches: [master, "claude/**"]
  pull_request:
  workflow_dispatch:
  # release.yml runs this whole workflow on the tagged commit before it
  # publishes (D516). `ref` is that commit's SHA; every checkout below
  # takes it, and on any other event it is empty, which checks out the
  # event's own commit as before.
  workflow_call:
    inputs:
      ref:
        description: "Commit SHA to check out and test"
        required: true
        type: string

# A second push to the same branch makes the first run's result irrelevant.
# A release's run is keyed by its commit instead: called from release.yml,
# `github.ref` is the caller's, and a dispatched release shares it with
# master's pushes, which would cancel the release's tests (or be cancelled
# by them).
concurrency:
  group: ci-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

# Least privilege by default: nothing in this workflow writes to the
# repository, so the token it runs with can only read it. A job that needs
# more says so itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Incremental compilation helps a developer's next edit, never a fresh
  # runner: it only makes the cache bigger and slower to save and restore
  # (D504). It also overrides `release-fast`'s `incremental = true`.
  CARGO_INCREMENTAL: "0"

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    # Every job has a timeout, well above its slowest cold-cache run, so a
    # hung test or a GUI step waiting on a display fails in minutes rather
    # than holding a runner for GitHub's default six hours.
    timeout-minutes: 10
    steps:
      # Pinned to full SHAs: a mutable tag in a workflow is a supply-chain
      # risk. The versions are in the trailing comments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # The version matches rust-toolchain.toml; strobe-conventions'
      # `toolchain` tests fail the build if the two drift.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-08
        with:
          toolchain: "1.98.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  changelog:
    name: changelog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # CHANGELOG.md is generated from the git history by `cargo xtask
    # changelog`, so a released section that disagrees with the tags is a
    # mistake, not a style choice. Released sections only: `Unreleased`
    # moves with every merge and a squash rewrites the very hashes it pins,
    # so gating pull requests on it would fail all of them for no signal.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          # The check reads `git tag` and walks the whole history. The
          # default checkout is shallow and fetches no tags at all, so
          # every release would come back missing and the check would fail
          # for a reason that has nothing to do with the changelog.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-08
        with:
          toolchain: "1.98.0"
      # A release's run (D516) restores the caches but saves none: a tag's
      # cache is readable by that tag alone, and a gigabyte of it per
      # release would push master's out of the repository's 10 GB, the
      # ones every pull request starts from (D505).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: changelog
          save-if: ${{ !inputs.ref }}
      # `--locked` on every cargo command that resolves dependencies: a
      # Cargo.lock that no longer matches the manifests fails here instead
      # of being quietly repaired on a throwaway runner. Before the alias,
      # so it reaches the `cargo run` that builds xtask.
      - run: cargo --locked xtask changelog --check
      # The icon PNGs and .ico are rendered from assets/brand/*.svg; a
      # source edited without `cargo xtask brand` fails here.
      - run: cargo --locked xtask brand --check
      # THIRD_PARTY.md (the About page's credits, D491) is generated from
      # the git history and Cargo.lock. A dependency that arrives, leaves or
      # changes licence, or a new contributor, without `cargo xtask credits`
      # fails here. It needs the whole history, which this job has.
      - run: cargo --locked xtask credits --check

  windows:
    name: windows (the shipping platform)
    runs-on: windows-latest
    # About 16 minutes on master with a warm cache; a cold one builds
    # three profiles' dependencies from scratch.
    timeout-minutes: 90
    # The platform the show runs on. A GitHub runner has no GPU and no
    # interactive session, so the renderer tests skip themselves here (no
    # headless GL context) — the Linux job below is where shaders are
    # actually compiled. This job is what proves the Windows build, the
    # WGL/EGL context code, and release settings compile and link.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-08
        with:
          toolchain: "1.98.0"
          components: clippy
      # rust-cache never saves after an exact hit, so a key that stays the
      # same keeps the cache it first saved. "-fast" names the cache that
      # holds release-fast (D504, D505); change it when the profiles built
      # here change, or master keeps restoring an old cache (D507).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: windows-fast
          save-if: ${{ !inputs.ref }}
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      # The runner has no headless EGL, so the GPU tests skip and pass.
      # They record each skip (D249), and the next step counts them into
      # the job summary, so a skip is never read as a pass.
      # The runner asks no one about firewall rules, so the tests that bind
      # every interface run here (D503); on a developer machine they skip.
      - name: Test
        shell: bash
        env:
          STROBE_SKIP_LOG: ${{ github.workspace }}/target/test-skips.log
          STROBE_TEST_LAN: "1"
        run: cargo test --locked --workspace --all-features
      - name: Report skipped GPU tests
        if: always()
        shell: bash
        run: |
          log=target/test-skips.log
          if [ ! -s "$log" ]; then
            echo "No test skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          count=$(cut -f1 "$log" | sort -u | wc -l | tr -d ' ')
          {
            echo "### ${count} test(s) passed by skipping, not by running"
            echo
            echo "| Reason | Skips |"
            echo "|---|---|"
            cut -f2 "$log" | sed 's/ (.*//' | sort | uniq -c | while read -r n reason; do
              echo "| ${reason} | ${n} |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # An optimised build proves the Windows binaries compile and link with
      # `panic = "abort"` and opt-level 3. A pull request builds
      # `release-fast` (the same settings without fat LTO and one codegen
      # unit); the shipping `release` build runs once a change is on master,
      # and again in release.yml for a tag (D504). Master builds
      # `release-fast` too: GitHub shares only the default branch's cache
      # with pull requests, so that is what keeps their release-fast
      # dependencies warm. Without it every pull request rebuilt them, 343 s
      # against `release`'s six minutes, and saved almost nothing (D505).
      #
      # A release's run (D516) skips the fat-LTO build: release.yml builds
      # exactly that, from the same commit, in its own job.
      - name: Build release-fast binaries
        run: cargo build --locked --profile release-fast --workspace --bins
      - name: Build release binaries (fat LTO, as shipped)
        if: ${{ !inputs.ref && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch') }}
        run: cargo build --locked --release --workspace --bins

  macos:
    name: macos (the portable crates)
    runs-on: macos-latest
    timeout-minutes: 60
    # macOS is a later target, so this job is deliberately two-tier.
    #
    # The blocking tier is every crate that has no OpenGL context in it:
    # the scene model, the GLSL library, the conventions and the tooling.
    # They must keep building and passing on a Mac so the port is not made
    # harder by drift in the meantime.
    #
    # `strobe-gfx` cannot build here yet. Its headless context is written
    # against glutin's EGL backend, and glutin compiles that backend out on
    # Apple targets (`not(apple)`); macOS contexts are CGL. That port is
    # future work, so the whole-workspace step below is informational: it
    # is allowed to fail, and its log is the running list of what is left.
    # When it goes green, delete the `--exclude` flags and the
    # `continue-on-error`, and make it the blocking tier.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-08
        with:
          toolchain: "1.98.0"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos
          save-if: ${{ !inputs.ref }}
      # Excluding strobe-gfx is not enough: cargo still builds it for a crate
      # that depends on it. strobe-autocontrol does (it renders to measure),
      # and strobe-shadertoy's tests do (they render the fixtures), so the
      # first is excluded and the second is checked without its tests.
      - name: Clippy (portable crates)
        run: cargo clippy --locked --workspace --exclude strobe-gfx --exclude strobe-bench --exclude strobe-app --exclude strobe-autocontrol --exclude strobe-shadertoy --all-targets --all-features -- -D warnings
      - name: Clippy (strobe-shadertoy without its rendering tests)
        run: cargo clippy --locked -p strobe-shadertoy --lib --bins --all-features -- -D warnings
      # The renderer tests in strobe-gfx self-skip without an EGL driver,
      # which a Mac runner does not have, so once strobe-gfx builds here
      # they will pass by skipping rather than prove anything; the Linux
      # job is where shaders are compiled.
      - name: Test (portable crates)
        env:
          STROBE_TEST_LAN: "1"
        run: cargo test --locked --workspace --exclude strobe-gfx --exclude strobe-bench --exclude strobe-app --exclude strobe-autocontrol --exclude strobe-shadertoy --all-features
      - name: Clippy (whole workspace, informational)
        continue-on-error: true
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  linux:
    name: linux (headless GL)
    runs-on: ubuntu-latest
    # About 8 minutes on master with a warm cache.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-08
        with:
          toolchain: "1.98.0"
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: linux-fast
          save-if: ${{ !inputs.ref }}
      # Mesa's software rasteriser behind surfaceless EGL: a real GLSL
      # compiler for both desktop GL 3.3 core (the native path) and GLES 3.0
      # (the dialect the ANGLE path speaks), with no display and no GPU.
      # Without these the renderer tests skip; with them, every shader the
      # assembler emits is compiled and linked on every push.
      - name: Install headless GL
        run: sudo apt-get update && sudo apt-get install -y libegl1 libegl-mesa0 libgl1-mesa-dri libglx-mesa0 libxkbcommon-dev libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxi6 libxrandr2 xvfb libasound2-dev pkg-config
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      # --all-features keeps `midi` on. This builds strobe-io the way a
      # MIDI-less build does, where code only the device layer reads is dead.
      - name: Clippy (strobe-io without MIDI)
        run: cargo clippy --locked -p strobe-io --no-default-features --all-targets -- -D warnings
      - name: Test
        env:
          STROBE_REQUIRE_HEADLESS_GL: "1"
          STROBE_TEST_LAN: "1"
        run: cargo test --locked --workspace --all-features
      # Starts the real app on a virtual X display, renders frames on both
      # windows through one shared GL context, and reads them back to PNGs.
      # The step fails if either image is missing. The two window steps
      # have timeouts of their own: a window that never gets its frames
      # waits, it does not fail.
      - name: App smoke test (Xvfb)
        timeout-minutes: 15
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" cargo run --locked -p strobe-app -- --scene 01 --screenshot target/ci-shot --frames 10
          test -s target/ci-shot-control.png
          test -s target/ci-shot-output.png

      # The window half of the auto-controls tests: the CLI scores a scene on
      # an EGL device and on a hidden window and the two reports must match
      # (D140). The plain Test step above has no display, so it skips them.
      - name: Auto-controls on a window context (Xvfb)
        timeout-minutes: 15
        env:
          STROBE_REQUIRE_HEADLESS_GL: "1"
          STROBE_REQUIRE_WINDOW_GL: "1"
        run: xvfb-run -a -s "-screen 0 1280x720x24" cargo test --locked -p strobe-autocontrol --test window

      # Render every scene in the library headless, once per GLSL dialect,
      # and keep the frames. Mesa's llvmpipe is CPU rasterisation, so the
      # timings in results.md are not a GPU's — but the *images* are a pure
      # function of time (fixed dt, synthetic audio), so a reviewer can
      # open the contact sheet from any pull request and see what a shader
      # or renderer change did, and the ranking of scenes by cost is still
      # meaningful. A scene that fails to compile in either dialect fails
      # the step. A few timed frames and a short warm-up keep it to a
      # minute or two; `cargo xtask bench` is the way to take real numbers.
      # `release-fast`, not `release`: the frames are the renderer's, and
      # fat LTO only cost build time here (D504).
      - name: Render the scene library (desktop GL 3.3)
        run: cargo run --locked --profile release-fast -p strobe-bench -- --size 640x360 --frames 10 --warmup 60 --out target/bench
      - name: Render the scene library (GLES 3.0, the ANGLE dialect)
        run: cargo run --locked --profile release-fast -p strobe-bench -- --size 640x360 --frames 10 --warmup 60 --api gles --out target/bench-gles
      # `!cancelled()` rather than the default success(): a run where one
      # scene broke is exactly the run whose other frames you want to see.
      - name: Upload frames (desktop GL)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-desktop
          path: target/bench
          if-no-files-found: warn
          retention-days: 14
      - name: Upload frames (GLES)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-gles
          path: target/bench-gles
          if-no-files-found: warn
          retention-days: 14
      # Type-checks the Windows-only code (WGL, ANGLE loading) without
      # linking, so a Linux push fails fast on a Windows-only mistake.
      # strobe-script is excluded: rquickjs compiles QuickJS's C sources,
      # which needs the MSVC toolchain and Windows SDK headers that a Linux
      # runner does not have. strobe-app depends on it, so it is excluded
      # too (its Windows branches are `cfg!` values, which the Linux build
      # already type-checks). The windows job above builds both natively.
      # strobe-shadertoy's `net` feature (ureq + rustls + ring) compiles C
      # for MSVC, so it is checked without that feature here (D110); the
      # Linux all-features clippy and the windows job cover the client.
      - name: Cross-check the Windows build
        run: cargo clippy --locked --workspace --exclude strobe-script --exclude strobe-app --exclude strobe-shadertoy --all-targets --all-features --target x86_64-pc-windows-msvc -- -D warnings
      - name: Cross-check strobe-shadertoy for Windows without its HTTP client
        run: cargo clippy --locked -p strobe-shadertoy --no-default-features --all-targets --target x86_64-pc-windows-msvc -- -D warnings
