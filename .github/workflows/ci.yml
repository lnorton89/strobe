name: CI

on:
  push:
    # `master` is the default branch; agent work lands on claude/*
    # branches first, which must be checked on every push too.
    branches: [master, "claude/**"]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: nothing in this workflow writes to the
# repository, so the token it runs with can only read it. A job that needs
# more says so itself.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      # Pinned to full SHAs: a mutable tag in a workflow is a supply-chain
      # risk. The versions are in the trailing comments.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version matches rust-toolchain.toml; strobe-conventions'
      # `toolchain` tests fail the build if the two drift.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-08
        with:
          toolchain: "1.98.0"
          components: rustfmt
      - run: cargo fmt --all -- --check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  changelog:
    name: changelog
    runs-on: ubuntu-latest
    # CHANGELOG.md is generated from the git history by `cargo xtask
    # changelog`, so a released section that disagrees with the tags is a
    # mistake, not a style choice. Released sections only: `Unreleased`
    # moves with every merge and a squash rewrites the very hashes it pins,
    # so gating pull requests on it would fail all of them for no signal.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check reads `git tag` and walks the whole history. The
          # default checkout is shallow and fetches no tags at all, so
          # every release would come back missing and the check would fail
          # for a reason that has nothing to do with the changelog.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-08
        with:
          toolchain: "1.98.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: changelog
      - run: cargo xtask changelog --check
      # The icon PNGs and .ico are rendered from assets/brand/*.svg; a
      # source edited without `cargo xtask brand` fails here.
      - run: cargo xtask brand --check

  windows:
    name: windows (the shipping platform)
    runs-on: windows-latest
    # The platform the show runs on. A GitHub runner has no GPU and no
    # interactive session, so the renderer tests skip themselves here (no
    # headless GL context) — the Linux job below is where shaders are
    # actually compiled. This job is what proves the Windows build, the
    # WGL/EGL context code, and release settings compile and link.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-08
        with:
          toolchain: "1.98.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: windows
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # The runner has no headless EGL, so the GPU tests skip and pass.
      # They record each skip (D249), and the next step counts them into
      # the job summary, so a skip is never read as a pass.
      - name: Test
        shell: bash
        env:
          STROBE_SKIP_LOG: ${{ github.workspace }}/target/test-skips.log
        run: cargo test --workspace --all-features
      - name: Report skipped GPU tests
        if: always()
        shell: bash
        run: |
          log=target/test-skips.log
          if [ ! -s "$log" ]; then
            echo "No test skipped." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          count=$(cut -f1 "$log" | sort -u | wc -l | tr -d ' ')
          {
            echo "### ${count} test(s) passed by skipping, not by running"
            echo
            echo "| Reason | Skips |"
            echo "|---|---|"
            cut -f2 "$log" | sed 's/ (.*//' | sort | uniq -c | while read -r n reason; do
              echo "| ${reason} | ${n} |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      # Release is where `panic = "abort"`, LTO and one codegen unit apply,
      # and those change what compiles.
      - name: Build release binary
        run: cargo build --release --workspace --bins

  macos:
    name: macos (the portable crates)
    runs-on: macos-latest
    # macOS is a later target, so this job is deliberately two-tier.
    #
    # The blocking tier is every crate that has no OpenGL context in it:
    # the scene model, the GLSL library, the conventions and the tooling.
    # They must keep building and passing on a Mac so the port is not made
    # harder by drift in the meantime.
    #
    # `strobe-gfx` cannot build here yet. Its headless context is written
    # against glutin's EGL backend, and glutin compiles that backend out on
    # Apple targets (`not(apple)`); macOS contexts are CGL. That port is
    # future work, so the whole-workspace step below is informational: it
    # is allowed to fail, and its log is the running list of what is left.
    # When it goes green, delete the `--exclude` flags and the
    # `continue-on-error`, and make it the blocking tier.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-08
        with:
          toolchain: "1.98.0"
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: macos
      # Excluding strobe-gfx is not enough: cargo still builds it for a crate
      # that depends on it. strobe-autocontrol does (it renders to measure),
      # and strobe-shadertoy's tests do (they render the fixtures), so the
      # first is excluded and the second is checked without its tests.
      - name: Clippy (portable crates)
        run: cargo clippy --workspace --exclude strobe-gfx --exclude strobe-bench --exclude strobe-app --exclude strobe-autocontrol --exclude strobe-shadertoy --all-targets --all-features -- -D warnings
      - name: Clippy (strobe-shadertoy without its rendering tests)
        run: cargo clippy -p strobe-shadertoy --lib --bins --all-features -- -D warnings
      # The renderer tests in strobe-gfx self-skip without an EGL driver,
      # which a Mac runner does not have, so once strobe-gfx builds here
      # they will pass by skipping rather than prove anything; the Linux
      # job is where shaders are compiled.
      - name: Test (portable crates)
        run: cargo test --workspace --exclude strobe-gfx --exclude strobe-bench --exclude strobe-app --exclude strobe-autocontrol --exclude strobe-shadertoy --all-features
      - name: Clippy (whole workspace, informational)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  linux:
    name: linux (headless GL)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master, 2026-08
        with:
          toolchain: "1.98.0"
          components: clippy
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: linux
      # Mesa's software rasteriser behind surfaceless EGL: a real GLSL
      # compiler for both desktop GL 3.3 core (the native path) and GLES 3.0
      # (the dialect the ANGLE path speaks), with no display and no GPU.
      # Without these the renderer tests skip; with them, every shader the
      # assembler emits is compiled and linked on every push.
      - name: Install headless GL
        run: sudo apt-get update && sudo apt-get install -y libegl1 libegl-mesa0 libgl1-mesa-dri libglx-mesa0 libxkbcommon-dev libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxi6 libxrandr2 xvfb libasound2-dev pkg-config
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test
        env:
          STROBE_REQUIRE_HEADLESS_GL: "1"
        run: cargo test --workspace --all-features
      # Starts the real app on a virtual X display, renders frames on both
      # windows through one shared GL context, and reads them back to PNGs.
      # The step fails if either image is missing.
      - name: App smoke test (Xvfb)
        run: |
          xvfb-run -a -s "-screen 0 1920x1080x24" cargo run -p strobe-app -- --scene 01 --screenshot target/ci-shot --frames 10
          test -s target/ci-shot-control.png
          test -s target/ci-shot-output.png

      # The window half of the auto-controls tests: the CLI scores a scene on
      # an EGL device and on a hidden window and the two reports must match
      # (D140). The plain Test step above has no display, so it skips them.
      - name: Auto-controls on a window context (Xvfb)
        env:
          STROBE_REQUIRE_HEADLESS_GL: "1"
          STROBE_REQUIRE_WINDOW_GL: "1"
        run: xvfb-run -a -s "-screen 0 1280x720x24" cargo test -p strobe-autocontrol --test window

      # Render every scene in the library headless, once per GLSL dialect,
      # and keep the frames. Mesa's llvmpipe is CPU rasterisation, so the
      # timings in results.md are not a GPU's — but the *images* are a pure
      # function of time (fixed dt, synthetic audio), so a reviewer can
      # open the contact sheet from any pull request and see what a shader
      # or renderer change did, and the ranking of scenes by cost is still
      # meaningful. A scene that fails to compile in either dialect fails
      # the step. A few timed frames and a short warm-up keep it to a
      # minute or two; `cargo xtask bench` is the way to take real numbers.
      - name: Render the scene library (desktop GL 3.3)
        run: cargo run --release -p strobe-bench -- --size 640x360 --frames 10 --warmup 60 --out target/bench
      - name: Render the scene library (GLES 3.0, the ANGLE dialect)
        run: cargo run --release -p strobe-bench -- --size 640x360 --frames 10 --warmup 60 --api gles --out target/bench-gles
      # `!cancelled()` rather than the default success(): a run where one
      # scene broke is exactly the run whose other frames you want to see.
      - name: Upload frames (desktop GL)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-desktop
          path: target/bench
          if-no-files-found: warn
          retention-days: 14
      - name: Upload frames (GLES)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-gles
          path: target/bench-gles
          if-no-files-found: warn
          retention-days: 14
      # Type-checks the Windows-only code (WGL, ANGLE loading) without
      # linking, so a Linux push fails fast on a Windows-only mistake.
      # strobe-script is excluded: rquickjs compiles QuickJS's C sources,
      # which needs the MSVC toolchain and Windows SDK headers that a Linux
      # runner does not have. strobe-app depends on it, so it is excluded
      # too (its Windows branches are `cfg!` values, which the Linux build
      # already type-checks). The windows job above builds both natively.
      # strobe-shadertoy's `net` feature (ureq + rustls + ring) compiles C
      # for MSVC, so it is checked without that feature here (D110); the
      # Linux all-features clippy and the windows job cover the client.
      - name: Cross-check the Windows build
        run: cargo clippy --workspace --exclude strobe-script --exclude strobe-app --exclude strobe-shadertoy --all-targets --all-features --target x86_64-pc-windows-msvc -- -D warnings
      - name: Cross-check strobe-shadertoy for Windows without its HTTP client
        run: cargo clippy -p strobe-shadertoy --no-default-features --all-targets --target x86_64-pc-windows-msvc -- -D warnings
