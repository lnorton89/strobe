# Temporary branch-only bootstrap: creates the PNG from the authored SVG.
# This file is removed after the generated PNG is committed to the PR.
name: Render Strobe architecture infographic
on:
  push:
    branches:
      - docs/engine-architecture-infographic
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Convert SVG to PNG
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2
          python -m pip install --disable-pip-version-check cairosvg
          cairosvg docs/images/strobe-engine-architecture.svg -o docs/images/strobe-engine-architecture.png
      - name: Commit rendered PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/strobe-engine-architecture.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: add high-resolution architecture PNG export"
            git push
          fi
